# Keep docker-compose.production.example.yml in step with this file whenever services or env change.
name: musicparty

x-user-env: &user-env
  PUID: "${PUID:-}"
  PGID: "${PGID:-}"

services:
  musicparty:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/app
    env_file: .env
    environment:
      <<: *user-env
      XDEBUG_CONFIG: client_host=host.docker.internal
      PHP_IDE_CONFIG: serverName=musicparty
      XDEBUG_MODE: debug
      XDEBUG_SESSION: start
      CADDY_SERVER_FRANKENPHP_OPTIONS: ""
      APP_INDEX_FILE: index.php
    depends_on:
      - redis
      - db

  reverb:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    environment: *user-env
    volumes:
      - ./:/app
    depends_on:
      - redis
      - db
    command: [ "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--debug" ]
    healthcheck:
      disable: true

  horizon:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    command: [ "php", "artisan", "horizon" ]
    env_file: .env
    environment: *user-env
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    healthcheck:
      disable: true

  scheduler:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    command: [ "php", "artisan", "schedule:work" ]
    env_file: .env
    environment: *user-env
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    healthcheck:
      disable: true

  db:
    image: mariadb:10.5-focal
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:6.2.6
    restart: unless-stopped

  composer:
    profiles: [ "composer" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "/entrypoint.sh", "composer" ]
    command: [ "--version" ]
    environment: *user-env
    volumes:
      - ./:/app
    healthcheck:
      disable: true

  test:
    profiles: [ "test" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "/entrypoint.sh", "php", "vendor/bin/phpunit" ]
    environment: *user-env
    volumes:
      - ./:/app
    healthcheck:
      disable: true

  vite:
    profiles: [ "vite" ]
    image: node:23
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      HOME: /tmp
    entrypoint: [ "npm" ]
    command: [ "run", "dev" ]
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - 5173:5173

  npm:
    profiles: [ "npm" ]
    image: node:23
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      HOME: /tmp
    entrypoint: [ "npm" ]
    command: [ "" ]
    working_dir: /app
    volumes:
      - ./:/app

  artisan:
    profiles: [ "artisan" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "/entrypoint.sh", "php", "/app/artisan" ]
    environment: *user-env
    volumes:
      - ./:/app/
    depends_on:
      - redis
      - db
    healthcheck:
      disable: true

  shell:
    profiles: [ "shell" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    command: [ "/bin/sh" ]
    environment: *user-env
    volumes:
      - ./:/app/
    depends_on:
      - redis
      - db
    healthcheck:
      disable: true
volumes:
  dbdata:
    driver: local
