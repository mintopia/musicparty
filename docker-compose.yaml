name: musicparty

services:
  musicparty:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/app
    env_file: .env
    environment:
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - PHP_IDE_CONFIG=serverName=musicparty
      - XDEBUG_MODE=debug
      - XDEBUG_SESSION=start
      - CADDY_SERVER_FRANKENPHP_OPTIONS=
      - APP_INDEX_FILE=index.php
    depends_on:
      - redis
      - db

  reverb:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/app
    depends_on:
      - redis
      - db
    env_file: .env
    entrypoint: [ "php", "artisan", "reverb:start", "--host=0.0.0.0" ]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      disable: true

  horizon:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    entrypoint: [ "php", "artisan", "horizon" ]
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    healthcheck:
      disable: true

  scheduler:
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    restart: unless-stopped
    entrypoint: [ "php", "artisan", "schedule:work" ]
    env_file: .env
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    healthcheck:
      disable: true

  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MARIADB_DATABASE: "${DB_DATABASE:-musicparty}"
      MARIADB_USER: "${DB_USERNAME:-musicparty}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-musicparty}"
    volumes:
      - ./docker/dbdata:/var/lib/mysql

  redis:
    image: redis:8
    restart: unless-stopped

  composer:
    profiles: [ "composer" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "composer" ]
    command: [ "--version" ]
    volumes:
      - ./:/app
    healthcheck:
      disable: true

  test:
    profiles: [ "test" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "php", "vendor/bin/phpunit" ]
    volumes:
      - ./:/app
    healthcheck:
      disable: true

  vite:
    profiles: [ "vite" ]
    image: node:24
    entrypoint: [ "npm" ]
    command: [ "run", "dev" ]
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - 5173:5173
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:5173/').then(() => process.exit(0), () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  npm:
    profiles: [ "npm" ]
    image: node:24
    entrypoint: [ "npm" ]
    command: [ "--version" ]
    working_dir: /app
    volumes:
      - ./:/app

  artisan:
    profiles: [ "artisan" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "php", "/app/artisan" ]
    volumes:
      - ./:/app/
    depends_on:
      - redis
      - db
    healthcheck:
      disable: true

  shell:
    profiles: [ "shell" ]
    build:
      context: .
      dockerfile: docker/develop/Dockerfile
    entrypoint: [ "/bin/sh" ]
    volumes:
      - ./:/app/
    depends_on:
      - redis
      - db
    healthcheck:
      disable: true
