name: CI

on:
  push:
    branches:
      - feature/v3-rewrite
      - 'epic/**'
      - develop
  pull_request:
    branches:
      - feature/v3-rewrite
      - 'epic/**'
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, pcntl, zip, opentelemetry
          coverage: xdebug
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pest (parallel, with coverage)
        env:
          XDEBUG_MODE: coverage
        run: >
          vendor/bin/pest --parallel --processes=4
          --coverage
          --coverage-clover=coverage/clover.xml
          --coverage-html=coverage/html

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/clover.xml ]; then
            php -r '
              $xml = simplexml_load_file("coverage/clover.xml");
              $m = $xml->project->metrics;
              $total = (int) $m["statements"];
              $covered = (int) $m["coveredstatements"];
              $pct = $total > 0 ? round($covered / $total * 100, 2) : 0;
              echo "## Coverage\n\nStatements: {$covered} / {$total} ({$pct}%)\n";
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  pint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, pcntl, zip, opentelemetry
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc

      - name: Pint
        run: vendor/bin/pint --test

  build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, pcntl, zip, opentelemetry
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc

      - name: PHPStan
        run: composer analyse

  rector:
    name: Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, pcntl, zip, opentelemetry
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc

      - name: Rector dry run
        run: composer rector

  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [develop, production]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  caddyfile:
    name: Caddyfile validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Caddyfile
        run: |
          mkdir -p "$RUNNER_TEMP/public"
          touch "$RUNNER_TEMP/public/frankenphp-worker.php"
          docker run --rm \
            -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$RUNNER_TEMP/public:/app/public:ro" \
            -e APP_PUBLIC_PATH=/app/public \
            -e CADDY_SERVER_WORKER_COUNT=1 \
            -e CADDY_SERVER_ADMIN_HOST=localhost \
            -e CADDY_SERVER_ADMIN_PORT=2019 \
            -e CADDY_SERVER_LOG_LEVEL=INFO \
            -e CADDY_SERVER_LOGGER=json \
            -e CADDY_SERVER_SERVER_NAME=:8080 \
            dunglas/frankenphp frankenphp validate --config /etc/caddy/Caddyfile --adapter caddyfile

  compose:
    name: Production compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate example production compose
        env:
          DB_DATABASE: musicparty
          DB_USERNAME: musicparty
          DB_PASSWORD: musicparty
        run: |
          touch .env
          docker compose -f docker-compose.production.example.yml config --quiet
