name: CI

on:
  push:
    branches:
      - feature/v3-rewrite
      - 'epic/**'
      - develop
  pull_request:
    branches:
      - feature/v3-rewrite
      - 'epic/**'
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, pcntl, zip, opentelemetry
          coverage: xdebug
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Pest (parallel, with coverage)
        if: ${{ !cancelled() }}
        env:
          XDEBUG_MODE: coverage
        run: >
          vendor/bin/pest --parallel --processes=4
          --coverage
          --coverage-clover=coverage/clover.xml
          --coverage-html=coverage/html

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/clover.xml ]; then
            php -r '
              $xml = simplexml_load_file("coverage/clover.xml");
              $m = $xml->project->metrics;
              $total = (int) $m["statements"];
              $covered = (int) $m["coveredstatements"];
              $pct = $total > 0 ? round($covered / $total * 100, 2) : 0;
              echo "## Coverage\n\nStatements: {$covered} / {$total} ({$pct}%)\n";
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  tests-mariadb:
    name: Tests (MariaDB 11.4)
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: musicparty
          MARIADB_DATABASE: musicparty_test
          MARIADB_USER: musicparty
          MARIADB_PASSWORD: musicparty
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DB_DRIVER: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      TEST_DB_DATABASE: musicparty_test
      DB_USERNAME: root
      DB_PASSWORD: musicparty
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, bcmath, intl, pcntl, zip, opentelemetry
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Pest (MariaDB)
        run: vendor/bin/pest

  tests-production:
    name: Tests (production profile, ${{ matrix.scheme }} APP_URL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [https, http]
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_APP_URL: ${{ matrix.scheme }}://music.example.test
      TEST_CACHE_STORE: redis
      TEST_SESSION_DRIVER: redis
      TEST_QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, pcntl, zip, redis, opentelemetry
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Pest (production profile)
        run: vendor/bin/pest -c phpunit.production.xml

  pint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, pcntl, zip, opentelemetry
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc

      - name: Pint
        run: vendor/bin/pint --test

  build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, pcntl, zip, opentelemetry
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Install
        run: npm ci

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Format check
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Type-check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Vitest
        if: ${{ !cancelled() }}
        run: npm test

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, pcntl, zip, opentelemetry
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc

      - name: PHPStan
        run: composer analyse

  rector:
    name: Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, pcntl, zip, opentelemetry
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=php --ignore-platform-req=ext-opentelemetry --ignore-platform-req=ext-grpc

      - name: Rector dry run
        run: composer rector

  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [develop, production]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  image-smoke:
    name: Production image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          load: true
          tags: musicparty:smoke
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Smoke test the built image
        run: tests/smoke/image/smoke.sh

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-smoke-logs
          path: tests/smoke/image/smoke-compose.log
          if-no-files-found: ignore

  websocket-smoke:
    name: Websocket routing smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          load: true
          tags: musicparty:smoke
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max

      - name: Check upgrade reaches Reverb and plain GET hits Laravel
        env:
          BUILD: '0'
        run: tests/smoke/websocket-routing.sh

  compose:
    name: Production compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate example production compose
        env:
          DB_DATABASE: musicparty
          DB_USERNAME: musicparty
          DB_PASSWORD: ci-compose-db-password
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          REVERB_APP_ID: ci-compose
          REVERB_APP_KEY: ci-compose-key
          REVERB_APP_SECRET: ci-compose-secret
        run: |
          touch .env
          docker compose -f docker-compose.production.example.yml config --quiet

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - tests
      - tests-mariadb
      - tests-production
      - pint
      - build
      - phpstan
      - rector
      - docker
      - image-smoke
      - websocket-smoke
      - compose
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .value.result == "success")' >/dev/null
