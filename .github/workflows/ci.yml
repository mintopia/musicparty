name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: opentelemetry
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-grpc
      - name: Pint
        run: vendor/bin/pint --test
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Vitest
        run: npm test
      - name: Vite build
        run: npm run build

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@2.62.1 lint openapi/openapi.json
      - name: Validate AsyncAPI
        run: npx --yes @asyncapi/cli@6.2.0 validate asyncapi/asyncapi.json --fail-severity warn

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
          tools: composer:v2
          extensions: opentelemetry
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-grpc
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
      - name: Pest with coverage
        run: vendor/bin/pest --parallel --coverage
