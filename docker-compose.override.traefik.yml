services:
  musicparty:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.musicparty-musicparty.rule=Host(`musicparty`)"
      - "traefik.http.services.musicparty-musicparty.loadbalancer.server.port=8080"
    networks:
      - default
      - frontend

networks:
  frontend:
    external: true
