# Example single-host production topology. Maintained in step with docker-compose.yml:
# update both whenever services or environment change.

name: musicparty

x-app: &app
  image: ghcr.io/mintopia/musicparty:latest
  restart: unless-stopped
  env_file: .env
  environment:
    PUID: "${PUID:-1000}"
    PGID: "${PGID:-1000}"
    TRUSTED_PROXIES: "*"
    APP_KEY: "${APP_KEY:?set APP_KEY}"
    DB_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
    REVERB_APP_ID: "${REVERB_APP_ID:?set REVERB_APP_ID}"
    REVERB_APP_KEY: "${REVERB_APP_KEY:?set REVERB_APP_KEY}"
    REVERB_APP_SECRET: "${REVERB_APP_SECRET:?set REVERB_APP_SECRET}"
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - logs:/app/storage/logs

services:
  app:
    <<: *app
    expose:
      - "8080"

  reverb:
    <<: *app
    command: [ "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080" ]
    healthcheck:
      disable: true

  horizon:
    <<: *app
    command: [ "php", "artisan", "horizon" ]
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: [ "php", "artisan", "schedule:work" ]
    healthcheck:
      disable: true

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE:?set DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME:?set DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  logs:
    driver: local
  dbdata:
    driver: local
  redisdata:
    driver: local
