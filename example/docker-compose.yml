x-app: &app
  image: ghcr.io/mintopia/musicparty:feature-v3-rewrite
  env_file: .env
  volumes:
    - ./logs:/app/storage/logs
    - ./storage/app:/app/storage/app

x-infrastructure: &infrastructure
  database:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  database:
    image: mariadb:11.8
    env_file: .env.mariadb
    restart: unless-stopped
    volumes:
      - ./database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]
    depends_on: *infrastructure

  web:
    <<: *app
    restart: unless-stopped
    command: ["web"]
    stop_grace_period: 30s
    depends_on:
      <<: *infrastructure
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  horizon:
    <<: *app
    restart: unless-stopped
    command: ["horizon"]
    stop_grace_period: 75s
    depends_on:
      <<: *infrastructure
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    restart: unless-stopped
    command: ["scheduler"]
    depends_on:
      <<: *infrastructure
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  reverb:
    <<: *app
    restart: unless-stopped
    command: ["reverb"]
    stop_grace_period: 30s
    depends_on: *infrastructure
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      disable: true

  artisan:
    <<: *app
    profiles:
      - artisan
    command: ["list"]
    depends_on: *infrastructure
    healthcheck:
      disable: true
